services:
  db:
    image: postgres:17
    restart: "no"
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: feat
      POSTGRES_USER: feat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feat -d feat"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: "no"
    environment:
      SPRING_PROFILES_ACTIVE: local
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data: