services:
  db:
    image: postgres:17
    restart: "no"
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: feat
      POSTGRES_USER: feat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feat -d feat"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: "no"
    environment:
      SPRING_PROFILES_ACTIVE: local
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -fsS http://localhost:8080/actuator/health | grep -q ''"status":"UP"'''
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  nginx:
    image: nginx:stable-alpine
    restart: "no"
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    restart: "no"
    volumes:
      - ../../frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
volumes:
  postgres_data:
  frontend_node_modules: